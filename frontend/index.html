<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="p3AXZq_rHAXy7eEzUz5WifJOt9_f833q23I3XqcZFbw" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Bookbaari - Browse, Borrow & Rent Books | Online Library & Lending Platform</title>
    <meta name="title" content="Bookbaari - Browse, Borrow & Rent Books | Online Library & Lending Platform" />
    <meta name="description" content="Bookbaari (also known as Book Baari) is your premier online library and book lending platform. Discover, search, and borrow books across fiction, non-fiction, academic, and regional literature in English, Hindi, and Gujarati." />
    <meta name="keywords" content="book, bookbaari, book baari, book-baari, online library, borrow books, read books, book lending, book tracker, library catalog, books, book collection, library, read online" />
    <meta name="author" content="Bookbaari" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://bookbaari.vercel.app/" />

    <!-- Open Graph / Facebook SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bookbaari.vercel.app/" />
    <meta property="og:site_name" content="Bookbaari" />
    <meta property="og:title" content="Bookbaari - Browse, Borrow & Rent Books | Online Library" />
    <meta property="og:description" content="Bookbaari (Book Baari) is your premier online library and book lending platform. Browse thousands of books across top authors, genres, and languages." />
    <meta property="og:image" content="https://bookbaari.vercel.app/favicon.svg" />

    <!-- Twitter Card SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://bookbaari.vercel.app/" />
    <meta name="twitter:title" content="Bookbaari - Browse, Borrow & Rent Books | Online Library" />
    <meta name="twitter:description" content="Bookbaari (Book Baari) is your premier online library and book lending platform. Browse thousands of books across top authors, genres, and languages." />
    <meta name="twitter:image" content="https://bookbaari.vercel.app/favicon.svg" />

    <!-- Structured Data / JSON-LD for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://bookbaari.vercel.app/#website",
          "url": "https://bookbaari.vercel.app/",
          "name": "Bookbaari",
          "alternateName": ["Book Baari", "BookBari", "Book", "Book-Baari"],
          "description": "Online library catalog and book lending tracker to borrow and read books.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://bookbaari.vercel.app/?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Library",
          "@id": "https://bookbaari.vercel.app/#organization",
          "name": "Bookbaari",
          "alternateName": ["Book Baari", "BookBari"],
          "url": "https://bookbaari.vercel.app/",
          "description": "Bookbaari is a modern digital and physical library lending platform offering thousands of books across genres and languages.",
          "knowsLanguage": ["English", "Hindi", "Gujarati"]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
